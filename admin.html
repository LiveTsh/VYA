<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#CC5500">
<title>VYA Admin</title>
<style>
:root{--o:#CC5500;--bg:#F8F9FA;--ink:#1A1A1A;--mut:#6B7280;--w:#fff;--line:#e5e7eb;--red:#b42318;--grn:#177245}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--o);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px;letter-spacing:.5px}header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
nav{display:flex;overflow-x:auto;background:var(--w);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:4}
nav button{flex:1 0 auto;border:0;background:none;padding:13px 10px;font-size:15px;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--o);border-color:var(--o);font-weight:600}
main{padding:14px 16px 80px;max-width:640px;margin:0 auto}
.card{background:var(--w);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--w);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:13px}.stat.hot b{color:var(--o)}
h2{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--o);color:#fff}
.btn.g{background:#eef0f2;color:var(--ink)}.btn.r{background:var(--red)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef0f2;color:var(--mut);margin-right:6px}
.tag.hot{background:#fde8d9;color:var(--o)}.tag.red{background:#fde4e1;color:var(--red)}
.mut{color:var(--mut);font-size:14px}select{padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;margin-top:8px;background:#fff}.seg{display:flex;gap:8px;margin-top:8px}.seg button{flex:1;border:0;border-radius:10px;padding:11px 6px;font-size:15px;background:#eef0f2;color:var(--ink)}.seg button.on{background:var(--ink);color:#fff}.dr{display:grid;grid-template-columns:1fr 1fr 1fr 36px;gap:6px}.dr input{margin-top:6px;min-width:0}.dr .v{grid-column:1/4}.dr button{border:0;background:none;font-size:22px;color:var(--mut)}input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;margin-top:8px;background:#fff}
#msg{position:fixed;left:12px;right:12px;bottom:14px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:9;text-align:center}
.center{max-width:380px;margin:60px auto;padding:0 16px}
a{color:var(--o)}
</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"><style>#plmap{height:260px;border-radius:12px;margin-top:10px}.plr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #eef0f3}.plr b{display:block}.plr .mut{font-size:13px}.plsug{border:0;background:#f4f5f7;border-radius:10px;padding:10px 12px;text-align:left;width:100%;margin-top:6px;font-size:15px}</style></head><body>
<div id="login" class="center" hidden>
  <h1 style="margin:0 0 4px">VYA Admin</h1><p class="mut">Sign in with your VYA account. Only people on the admin list get in.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="row"><button class="btn" style="width:100%" id="go">Sign in</button></div><p id="lerr" class="mut" style="color:var(--red)"></p>
</div>
<div id="app" hidden>
  <header><b>VYA Admin</b><button id="out">Sign out</button></header>
  <nav><button data-t="ov" class="on">Overview</button><button data-t="ap">Approvals <span id="nap"></span></button><button data-t="pe">People</button><button data-t="rp">Reports <span id="nrp"></span></button><button data-t="ph">Photos <span id="nph"></span></button><button data-t="ac">Fees</button><button data-t="nb">Nearby</button><button data-t="pl">Places</button></nav>
  <main id="view"></main>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>
const sb=window.supabase.createClient("https://chncstdkoglykcrgxvfh.supabase.co","sb_publishable_4jo_x0_7NRdK3GEhfxvxwA_rTDAaiLA");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab=(location.hash||'').slice(1),q='',flagged=true,busy=false;if(!['ov','ap','pe','rp','rg','ph','ac','nb','pl'].includes(tab))tab='ov';
function say(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',3200)}
function plain(e){const m=(e&&e.message)||'';if(/Not allowed/i.test(m))return 'This account is not on the admin list.';if(/paused/i.test(m))return m;if(/network|fetch/i.test(m))return 'No connection. Try again.';return m||'Something went wrong. Try again.'}
async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return showLogin();
  const {data:ok,error}=await sb.rpc('is_admin');
  if(error||ok!==true){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent='This account is not on the admin list.';return}
  $('login').hidden=true;$('app').hidden=false;render();
}
function showLogin(){$('app').hidden=true;$('login').hidden=false}
let idleT=null;function idleReset(){clearTimeout(idleT);idleT=setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'});}catch(e){}showLogin();$('lerr').textContent='Signed out after 15 minutes of no activity.';},900000)}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,idleReset,{passive:true}));idleReset();
$('go').onclick=async()=>{$('lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){$('lerr').textContent='Wrong email or password.';return}boot()};
$('out').onclick=async()=>{await sb.auth.signOut({scope:'local'});showLogin()};
function markTab(){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===tab))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;history.replaceState(null,'','#'+tab);document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
async function render(){
  markTab();const v=$('view');v.innerHTML='<p class="mut">Loading…</p>';
  try{ if(tab==='ov')await ov(v); else if(tab==='ap')await ap(v); else if(tab==='rp')await rp(v); else if(tab==='rg')await rg(v); else if(tab==='ph')await ph(v); else if(tab==='ac')await ac(v); else if(tab==='nb')await nb(v); else if(tab==='pl')await pl(v); else await pe(v); }catch(e){v.innerHTML='<div class="card">'+esc(plain(e))+'</div>'}
  refreshBadge();
}
async function refreshBadge(){try{const {data}=await sb.rpc('admin_pending');const ax=await sb.rpc('admin_applications');const nA=(data?data.filter(r=>r.kind==='listing').length:0)+(ax.data?ax.data.length:0);$('nap').textContent=nA?'('+nA+')':'';const r=await sb.rpc('admin_reports',{p_open:true});$('nrp').textContent=r.data&&r.data.length?'('+r.data.length+')':'';const f=await sb.rpc('admin_photos');$('nph').textContent=f.data&&f.data.length?'('+f.data.length+')':''}catch(e){}}
async function ov(v){
  const {data:j,error}=await sb.rpc('admin_overview');if(error)throw error;
  const s=(n,l,hot)=>`<div class="stat${hot&&n>0?' hot':''}"><b>${esc(n)}</b><span>${esc(l)}</span></div>`;
  v.innerHTML=`<h2>Needs you</h2><div class="grid">${s(j.drivers_pending,'Drivers waiting',1)}${s(j.vehicles_pending,'Cars waiting',1)}${s(j.listings_pending,'Nearby listings waiting',1)}${s(j.paused,'Paused accounts')}</div>
  <h2>Rides</h2><div class="grid">${s(j.requests_waiting,'Waiting for a driver now')}${s(j.rides_today,'Completed today')}${s(j.rides_7d,'Completed, last 7 days')}${s(j.rides_total,'Completed, all time')}</div>
  <h2>People</h2><div class="grid">${s(j.people,'Accounts')}${s(j.drivers_approved,'Approved drivers')}</div>
  <p class="mut" style="margin-top:16px">Driver fee payments are not on this page yet. For now you check the bank app and tell me who to activate.</p>`;
}
async function ap(v){
  const [A,P]=await Promise.all([sb.rpc('admin_applications'),sb.rpc('admin_pending')]);
  if(A.error)throw A.error;if(P.error)throw P.error;
  const apps=A.data,lst=P.data.filter(r=>r.kind==='listing');
  if(!apps.length&&!lst.length){v.innerHTML='<div class="card">Nothing waiting. 🎉</div>';return}
  const card=r=>{
    const miss=[];if(!r.name)miss.push('name');if(!r.phone)miss.push('phone');if(!r.id_number)miss.push('ID number');if(!r.photo_path)miss.push('photo');if(!r.cars.length)miss.push('a car');
    const re=r.status==='approved';
    return `<div class="card"><span class="tag hot">${re?'Changes to review':'New driver'}</span><b>${esc(r.name||'No name')}</b>
    <div class="mut">${r.phone?'<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>':'No phone'}</div>
    ${r.photo_path?`<div style="margin:10px 0"><img data-p="${esc(r.photo_path)}" alt="" style="width:200px;height:200px;object-fit:cover;border-radius:12px;background:#eee"></div>`:''}
    <div class="mut">${r.id_number?esc(r.id_kind==='passport'?'Passport':'ID')+': <b style="color:var(--ink)">'+esc(r.id_number)+'</b>'+(r.id_status==='checked'?' · checked':''):'No ID number'}</div>
    <div style="margin:8px 0">${r.cars.length?r.cars.map(c=>`<div>${esc(c.car)} <span class="tag ${c.ok?'':'hot'}">${c.ok?'approved':'waiting'}</span></div>`).join(''):'<div class="mut">No car added</div>'}</div>
    <div class="mut">Check the photo matches the licence and the car matches its registration.</div>
    ${miss.length?`<div class="mut" style="color:#b00020">Missing: ${miss.join(', ')}</div>`:''}
    <div class="row"><button class="btn" data-u="${esc(r.user_id)}" data-a="1" ${miss.length?'disabled style="opacity:.4"':''}>Approve</button>${re?'':`<button class="btn g" data-u="${esc(r.user_id)}" data-a="0">Reject</button>`}</div></div>`};
  v.innerHTML=(apps.length?'<h2>Drivers</h2>'+apps.map(card).join(''):'')+(lst.length?'<h2>Nearby listings</h2>'+lst.map(r=>`<div class="card"><span class="tag hot">Nearby</span><b>${esc(r.name||'No name')}</b>
   <div class="mut">${esc(r.info||'')}</div><div class="mut">${r.phone?'<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>':''}</div>
   <div class="row"><button class="btn" data-k="listing" data-i="${esc(r.id)}" data-a="1">Approve</button><button class="btn g" data-k="listing" data-i="${esc(r.id)}" data-a="0">Reject</button></div></div>`).join(''):'');
  v.querySelectorAll('img[data-p]').forEach(async im=>{const {data:d}=await sb.storage.from('profile-photos').createSignedUrl(im.dataset.p,600);if(d&&d.signedUrl)im.src=d.signedUrl});
  v.querySelectorAll('button[data-u]').forEach(b=>b.onclick=async()=>{
    if(busy||b.disabled)return;const ok=b.dataset.a==='1';if(!ok&&!confirm('Reject this driver? It cannot be undone from here.'))return;
    busy=true;const {error}=ok?await sb.rpc('admin_approve_driver',{p_user:b.dataset.u}):await sb.rpc('admin_decide',{p_kind:'driver',p_id:b.dataset.u,p_approve:false});busy=false;
    if(error)return say(plain(error));say(ok?'Approved':'Rejected');render()});
  v.querySelectorAll('button[data-k]').forEach(b=>b.onclick=async()=>{
    if(busy)return;const ok=b.dataset.a==='1';if(!ok&&!confirm('Reject this? It cannot be undone from here.'))return;
    busy=true;const {error}=await sb.rpc('admin_decide',{p_kind:b.dataset.k,p_id:b.dataset.i,p_approve:ok});busy=false;
    if(error)return say(plain(error));say(ok?'Approved':'Rejected');render()});
}
async function rp(v){
  const {data,error}=await sb.rpc('admin_reports',{p_open:true});if(error)throw error;
  if(!data.length){v.innerHTML='<div class="card">No open reports.</div>';return}
  const lab={unsafe:'Felt unsafe',payment:'Wrong charge',no_show:'No-show',car_mismatch:'Car did not match',app:'App problem',other:'Other'};
  v.innerHTML=data.map(r=>`<div class="card"><span class="tag ${r.topic==='unsafe'?'red':'hot'}">${esc(lab[r.topic]||r.topic)}</span><b>${esc(r.reporter||'No name')}</b> <span class="tag">${esc(r.role||'')}</span>
   <div class="mut" style="margin-top:8px">THEIR WORDS (not checked)</div><p style="margin:2px 0 8px">${esc(r.details)}</p><div class="mut">VYA RECORD</div><div class="mut" style="color:var(--ink)">${r.ride_info?esc(r.ride_info):'No ride attached'}</div>
   <div class="mut">${r.phone?'<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a> · ':''}${esc(new Date(r.created_at).toLocaleString())}</div>
   <div class="row"><button class="btn g" data-d="${esc(r.id)}">Mark done</button></div></div>`).join('');
  v.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
    if(busy)return;busy=true;const {error}=await sb.rpc('admin_resolve_report',{p_id:b.dataset.d});busy=false;
    if(error)return say(plain(error));say('Done');render()});
}
async function rg(v){
  const DN=['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const {data,error}=await sb.rpc('admin_regulars');if(error)throw error;
  v.innerHTML=`<div class="card"><b>New Regular</b><div class="mut">A trip people make again and again. Pick one area and one destination people already travel to.</div>
   <input id="rf" placeholder="From (e.g. Motherwell NU 29)"><input id="rt" placeholder="To (e.g. Greenacres)">
   <div class="row" id="rd">${[1,2,3,4,5,6,7].map(d=>`<label style="margin-right:10px"><input type="checkbox" value="${d}" style="width:auto;margin:0 4px 0 0">${DN[d]}</label>`).join('')}</div>
   <input id="rh" type="time" value="06:30"><div class="row"><button class="btn" id="rc">Create</button></div></div>`+
  (data.length?data.map(r=>`<div class="card"><b>${esc(r.from_area)} → ${esc(r.to_label)}</b> <span class="tag ${r.status==='active'?'hot':''}">${esc(r.status)}</span>
   <div class="mut">${esc(r.days.map(d=>DN[d]).join(', '))} · ${esc(String(r.depart_time).slice(0,5))}</div>
   <div class="mut">${esc(r.members)} members · ${esc(r.going_next)} going next time</div>
   ${r.status==='active'?`<div class="row"><button class="btn" data-n="${esc(r.id)}">Post notice</button><button class="btn g" data-c="${esc(r.id)}">Close</button></div>`:''}</div>`).join(''):'<div class="card">No Regulars yet.</div>');
  $('rc').onclick=async()=>{
    if(busy)return;const days=[...document.querySelectorAll('#rd input:checked')].map(x=>+x.value);
    if(!$('rf').value.trim()||!$('rt').value.trim()||!days.length||!$('rh').value)return say('Fill in from, to, at least one day and the time.');
    busy=true;const {error}=await sb.rpc('admin_create_regular',{p_from:$('rf').value,p_to:$('rt').value,p_days:days,p_time:$('rh').value});busy=false;
    if(error)return say(plain(error));say('Created');render()};
  v.querySelectorAll('[data-n]').forEach(b=>b.onclick=async()=>{
    const t=prompt('Notice for members (2 to 280 characters). It shows for 7 days:');if(!t||busy)return;
    busy=true;const {error}=await sb.rpc('admin_post_regular_note',{p_id:b.dataset.n,p_body:t});busy=false;
    if(error)return say(plain(error));say('Posted')});
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{
    if(busy||!confirm('Close this Regular? Members will no longer see it.'))return;
    busy=true;const {error}=await sb.rpc('admin_close_regular',{p_id:b.dataset.c});busy=false;
    if(error)return say(plain(error));say('Closed');render()});
}
async function ph(v){
  const {data,error}=await sb.rpc('admin_photos');if(error)throw error;
  if(!data.length){v.innerHTML='<div class="card">No photos waiting.</div>';return}
  v.innerHTML=data.map(r=>`<div class="card"><b>${esc(r.name||'No name')}</b> <span class="tag">${esc(r.role||'')}</span>
   <div style="margin:10px 0"><img data-p="${esc(r.path)}" alt="" style="width:200px;height:200px;object-fit:cover;border-radius:12px;background:#eee"></div>
   <div class="mut">Approve only if it is a clear photo of one real face, and (for drivers) it matches their licence.</div>
   <div class="row"><button class="btn" data-u="${esc(r.user_id)}" data-a="1">Approve</button><button class="btn r" data-u="${esc(r.user_id)}" data-a="0">Reject</button></div></div>`).join('');
  v.querySelectorAll('img[data-p]').forEach(async im=>{const {data:d}=await sb.storage.from('profile-photos').createSignedUrl(im.dataset.p,600);if(d&&d.signedUrl)im.src=d.signedUrl});
  v.querySelectorAll('button[data-u]').forEach(b=>b.onclick=async()=>{
    if(busy)return;busy=true;const {error}=await sb.rpc('admin_photo_decide',{p_user:b.dataset.u,p_ok:b.dataset.a==='1'});busy=false;
    if(error)return say(plain(error));say(b.dataset.a==='1'?'Approved':'Rejected');render()});
}

let nbw='ongoing',nbBlob=null;
function nbDay(d){try{return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
async function nbPhoto(file){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const TW=1200,TH=750,k=Math.max(TW/bmp.width,TH/bmp.height),sw=TW/k,sh=TH/k,sx=(bmp.width-sw)/2,sy=Math.max(0,Math.min(bmp.height-sh,(bmp.height-sh)*0.4));
  const cv=document.createElement('canvas');cv.width=TW;cv.height=TH;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,TW,TH);cx.imageSmoothingQuality='high';cx.drawImage(bmp,sx,sy,sw,sh,0,0,TW,TH);
  let b=null;for(const qq of [.85,.75,.65,.55]){b=await new Promise(r=>cv.toBlob(r,'image/jpeg',qq));if(b&&b.size<=550*1024)break}
  return b;
}
async function nb(v){
  nbw='ongoing';nbBlob=null;
  const {data:rows,error}=await sb.rpc('admin_nearby_list');if(error)throw error;
  const now=Date.now(),L=(rows||[]).map(r=>{const due=!r.ends_at&&r.status==='approved'&&(now-Date.parse(r.confirmed_at))>50*864e5;const gone=!r.ends_at&&r.status==='approved'&&(now-Date.parse(r.confirmed_at))>60*864e5;
    return `<div class="card"><b>${esc(r.business_name)}</b><div class="mut">${esc(r.title)} · ${esc(r.area)}</div><div style="margin-top:6px"><span class="tag">${r.status}</span><span class="tag">${r.ends_at?'Until '+nbDay(r.ends_at):'Ongoing'}</span>${r.claimed?'<span class="tag">Has owner</span>':'<span class="tag hot">No owner</span>'}${gone?'<span class="tag red">Hidden: not confirmed</span>':due?'<span class="tag hot">Confirm soon</span>':''}</div>
    <div class="row">${!r.ends_at&&r.status==='approved'?`<button class="btn g" data-a="c" data-i="${r.id}">Still running</button>`:''}<button class="btn g" data-a="h" data-i="${r.id}">Hand over</button><button class="btn r" data-a="x" data-i="${r.id}">Remove</button></div></div>`}).join('');
  v.innerHTML=`<div class="card"><b>Add a listing</b><div class="mut">Goes live straight away with no owner. Hand it over when the business signs up.</div>
  <select id="nc"><option value="deal">Deal</option><option value="community">Community</option><option value="safety">Safety</option></select>
  <input id="nt" maxlength="80" placeholder="What are they offering? e.g. Platter, R75"><input id="nbz" maxlength="60" placeholder="Business or group name"><input id="na" maxlength="40" placeholder="Area, e.g. KwaZakhele">
  <input id="ns" maxlength="80" placeholder="Venue (only if different from the business)"><input id="nd" maxlength="200" placeholder="More detail (optional)"><input id="nk" maxlength="60" placeholder="Phone or WhatsApp (optional)"><input id="nco" maxlength="40" placeholder="Cost, e.g. Free or R75 (optional)"><input id="nl" maxlength="300" placeholder="Link to website or video (optional)">
  <label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input id="ndel" type="checkbox" style="width:auto;margin:0">We deliver</label>
  <div class="mut" style="margin-top:12px">For how long?</div><div class="seg" id="nwh"><button data-w="ongoing" class="on">Ongoing</button><button data-w="until">Until a date</button><button data-w="dates">Dates</button></div>
  <input id="nu" type="date" hidden><div id="ndw" hidden><div id="ndr"></div><div class="row"><button class="btn g" id="nda">Add date</button></div></div>
  <div class="mut" style="margin-top:12px">Picture (optional)</div><input id="np" type="file" accept="image/*"><div id="npn" class="mut"></div>
  <div class="row"><button class="btn" id="nsend" style="width:100%">Add listing</button></div></div><h2>Listings</h2>${L||'<p class="mut">Nothing yet.</p>'}`;
  const wh=$('nwh');wh.onclick=e=>{const b=e.target.closest('button');if(!b)return;nbw=b.dataset.w;wh.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('nu').hidden=nbw!=='until';$('ndw').hidden=nbw!=='dates';if(nbw==='dates'&&!$('ndr').children.length)addRow()};
  function addRow(){if($('ndr').children.length>=5)return;const d=document.createElement('div');d.className='dr';d.innerHTML='<input type="date" class="d"><input type="time" class="f"><input type="time" class="t"><button type="button">×</button><input class="v" placeholder="Venue (optional)">';d.querySelector('button').onclick=()=>{d.remove();$('nda').hidden=false};$('ndr').appendChild(d);$('nda').hidden=$('ndr').children.length>=5}
  $('nda').onclick=addRow;
  $('np').onchange=async e=>{const f=e.target.files[0];nbBlob=null;$('npn').textContent='';if(!f)return;try{nbBlob=await nbPhoto(f);$('npn').textContent='Picture ready ('+Math.round(nbBlob.size/1024)+' KB, cropped to fit)'}catch(x){$('npn').textContent='Could not read that picture.'}};
  $('nsend').onclick=async()=>{
    if(busy)return;let ends=null,dates=null;
    if(nbw==='until'){const u=$('nu').value;if(!u)return say('Pick the end date');ends=new Date(u+'T23:59:00').toISOString()}
    if(nbw==='dates'){const rs=[...document.querySelectorAll('#ndr .dr')].map(r=>({d:r.querySelector('.d').value,f:r.querySelector('.f').value,t:r.querySelector('.t').value,v:r.querySelector('.v').value.trim()})).filter(x=>x.d).sort((a,b)=>a.d<b.d?-1:1);if(!rs.length)return say('Add at least one date');const l=rs[rs.length-1];ends=new Date(l.d+'T'+(l.t||'23:59')+':00').toISOString();dates=rs.map(x=>({d:x.d,f:x.f||undefined,t:x.t||undefined,v:x.v||undefined}))}
    busy=true;let path=null;
    try{
      if(nbBlob){const {data:u}=await sb.auth.getUser();path=u.user.id+'/'+crypto.randomUUID()+'.jpg';const up=await sb.storage.from('nearby-pictures').upload(path,nbBlob,{contentType:'image/jpeg',upsert:false});if(up.error){path=null;throw up.error}}
      const {error}=await sb.rpc('admin_add_listing',{p_category:$('nc').value,p_business:$('nbz').value,p_area:$('na').value,p_title:$('nt').value,p_detail:$('nd').value||null,p_contact:$('nk').value||null,p_ends_at:ends,p_image_path:path,p_offers_delivery:$('ndel').checked,p_venue:$('ns').value||null,p_cost:$('nco').value||null,p_link:$('nl').value||null,p_dates:dates});
      if(error){if(path)try{await sb.storage.from('nearby-pictures').remove([path])}catch(e){}throw error}
      say('Added. It is live now.');busy=false;render();
    }catch(e){busy=false;say(plain(e))}
  };
  v.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    if(busy)return;const a=b.dataset.a,id=b.dataset.i;let r;
    if(a==='c'){busy=true;r=await sb.rpc('confirm_nearby_listing',{p_id:id});busy=false;say(r.error?plain(r.error):'Confirmed for 60 days')}
    else if(a==='h'){const em=prompt('Email of the business’s VYA account:');if(!em||!em.trim())return;busy=true;r=await sb.rpc('admin_handover_listing',{p_id:id,p_email:em.trim()});busy=false;say(r.error?plain(r.error):'Handed over')}
    else if(a==='x'){if(!confirm('Remove this listing?'))return;busy=true;r=await sb.rpc('admin_remove_listing',{p_id:id});busy=false;say(r.error?plain(r.error):'Removed')}
    render();
  });
}

let plRows=null,plMap=null,plMk=null,plPt=null;
const PL_KEY='3ef7fec6ea8a4bd89a1c62606425f248';
const plNorm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’`]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const plK=(la,lo)=>Number(la).toFixed(5)+','+Number(lo).toFixed(5);
async function pl(v){
  plPt=null;
  const {data:ed,error}=await sb.rpc('get_place_edits');if(error)throw error;
  if(!plRows){try{const r=await fetch('places.json');plRows=r.ok?await r.json():[]}catch(e){plRows=[]}}
  const hid=new Set((ed.hidden||[]).map(String)),add=ed.added||[];
  const A=add.map(a=>`<div class="plr"><div><b>${esc(a.name)}</b><span class="mut">${esc(a.addr||'')}</span></div><button class="btn g" data-x="${a.id}">Remove</button></div>`).join('');
  const H=[...hid].map(k=>{const r=plRows.find(x=>plK(x[2],x[3])===k);return `<div class="plr"><div><b>${esc(r?r[0]:k)}</b><span class="mut">${esc(r?r[1]:'')}</span></div><button class="btn g" data-u="${esc(k)}">Show again</button></div>`}).join('');
  v.innerHTML=`<div class="card"><b>Add a place</b><div class="mut">Passengers will find it when they search. Move the map to the spot, then tap the exact spot.</div>
  <input id="pln" maxlength="80" placeholder="Name, e.g. Salama Supermarket"><input id="pla" maxlength="90" placeholder="Street or area (optional)">
  <input id="plq" placeholder="Search the map to move it (street, area)"><div id="plsug"></div><div id="plmap"></div><div id="plpt" class="mut" style="margin-top:6px">No spot chosen yet.</div>
  <div class="row"><button class="btn" id="pladd" style="width:100%">Add place</button></div></div>
  <div class="card"><b>Find a place</b><div class="mut">Search all ${plRows.length.toLocaleString()} places. Hide any that are wrong or closed.</div><input id="plf" placeholder="Type a name or street"><div id="plfr"></div></div>
  <h2>Added by you</h2>${A||'<p class="mut">None yet.</p>'}<h2>Hidden</h2>${H||'<p class="mut">None hidden.</p>'}`;
  plMap=L.map('plmap',{zoomControl:true}).setView([-33.88,25.57],13);
  L.tileLayer('https://maps.geoapify.com/v1/tile/positron/{z}/{x}/{y}{r}.png?apiKey='+PL_KEY,{maxZoom:19,attribution:'© OpenStreetMap · Geoapify'}).addTo(plMap);
  plMk=null;
  const setPt=ll=>{plPt={lat:ll.lat,lng:ll.lng};if(plMk)plMk.setLatLng(ll);else{plMk=L.marker(ll,{draggable:true}).addTo(plMap);plMk.on('dragend',()=>setPt(plMk.getLatLng()))}$('plpt').textContent='Spot chosen: '+ll.lat.toFixed(5)+', '+ll.lng.toFixed(5)};
  plMap.on('click',e=>setPt(e.latlng));
  let qt;$('plq').oninput=()=>{clearTimeout(qt);const q=$('plq').value.trim();if(q.length<3){$('plsug').innerHTML='';return}qt=setTimeout(async()=>{try{const r=await fetch('https://api.geoapify.com/v1/geocode/search?text='+encodeURIComponent(q)+'&filter=circle:25.60,-33.96,45000&bias=proximity:25.60,-33.96&limit=5&format=json&apiKey='+PL_KEY);const j=await r.json();const rs=(j.results||[]).filter(x=>isFinite(x.lat));$('plsug').innerHTML=rs.map((x,i)=>`<button class="plsug" data-i="${i}">${esc(x.formatted||x.name)}</button>`).join('');$('plsug').querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=rs[b.dataset.i];plMap.setView([x.lat,x.lon],18);$('plsug').innerHTML=''})}catch(e){}},350)};
  $('plf').oninput=()=>{const q=plNorm($('plf').value);if(q.length<2){$('plfr').innerHTML='';return}const qt=q.split(' ');const out=[];for(const r of plRows){const t=plNorm(r[0]+' '+r[1]);if(qt.every(w=>t.includes(w))){out.push(r);if(out.length>=20)break}}
    $('plfr').innerHTML=out.map(r=>{const k=plK(r[2],r[3]);return `<div class="plr"><div><b>${esc(r[0])}</b><span class="mut">${esc(r[1])}</span></div>${hid.has(k)?'<span class="mut">Hidden</span>':`<button class="btn g" data-h="${esc(k)}" data-n="${esc(r[0])}">Hide</button>`}</div>`}).join('')||'<p class="mut">Nothing found.</p>';
    $('plfr').querySelectorAll('[data-h]').forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;const r=await sb.rpc('admin_hide_place',{p_pkey:b.dataset.h,p_name:b.dataset.n});busy=false;say(r.error?plain(r.error):'Hidden. Passengers will no longer see it.');render()})};
  $('pladd').onclick=async()=>{if(busy)return;const n=$('pln').value.trim();if(n.length<2)return say('Type the place name');if(!plPt)return say('Tap the exact spot on the map');busy=true;const r=await sb.rpc('admin_add_place',{p_name:n,p_addr:$('pla').value.trim()||null,p_lat:plPt.lat,p_lng:plPt.lng});busy=false;say(r.error?plain(r.error):'Added. Phones pick it up within minutes.');render()};
  v.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(busy||!confirm('Remove this place?'))return;busy=true;const r=await sb.rpc('admin_remove_added_place',{p_id:b.dataset.x});busy=false;say(r.error?plain(r.error):'Removed');render()});
  v.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;const r=await sb.rpc('admin_unhide_place',{p_pkey:b.dataset.u});busy=false;say(r.error?plain(r.error):'Showing again');render()});
}
let acq='';
async function ac(v){
  const {data:ptxt}=await sb.rpc('admin_get_payment_text');
  v.innerHTML=`<div class="card"><b>What drivers see under "How to pay"</b><textarea id="pt" style="width:100%;min-height:90px;margin-top:8px;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px" maxlength="400" placeholder="e.g. PayShap ID or bank name, account number, and: use your VYA reference">${esc(ptxt||'')}</textarea><div class="row"><button class="btn" id="ptsave">Save</button></div></div>
  <input id="aq" placeholder="Find a driver: name, phone or VYA-reference" value="${esc(acq)}"><div id="al"></div>`;
  $('ptsave').onclick=async()=>{const {error}=await sb.rpc('admin_set_payment_text',{p_text:$('pt').value});say(error?plain(error):'Saved')};
  let t;$('aq').oninput=e=>{acq=e.target.value;clearTimeout(t);t=setTimeout(lst,350)};lst();
  async function lst(){
    const {data,error}=await sb.rpc('admin_find_access',{p_q:acq});if(error){$('al').innerHTML='<div class="card">'+esc(plain(error))+'</div>';return}
    if(!data.length){$('al').innerHTML='<div class="card" style="margin-top:12px">No drivers found.</div>';return}
    $('al').innerHTML=data.map(d=>{const on=d.paid_until&&new Date(d.paid_until)>new Date();
      return `<div class="card" style="margin-top:12px"><b>${esc(d.name||'No name')}</b> <span class="tag ${on?'':'red'}">${on?'On until '+esc(new Date(d.paid_until).toLocaleDateString()):(d.free_left>0?esc(d.free_left)+' free left':(d.free_left===0?'Off':'New'))}</span>
      <div class="mut">${d.phone?'<a href="tel:'+esc(d.phone)+'">'+esc(d.phone)+'</a> · ':''}${esc(d.reference||'No reference yet')}</div>
      <div class="row"><button class="btn g" data-d="${esc(d.driver_id)}" data-p="day">+1 day R30</button><button class="btn" data-d="${esc(d.driver_id)}" data-p="week">+7 days R140</button><button class="btn g" data-d="${esc(d.driver_id)}" data-p="month">+30 days R500</button></div></div>`}).join('');
    $('al').querySelectorAll('button[data-d]').forEach(b=>b.onclick=async()=>{
      const nm=b.closest('.card').querySelector('b').textContent,rf=(b.closest('.card').querySelector('.mut')||{}).textContent||'';
      if(busy||!confirm('Switch on '+nm+' for '+b.dataset.p+'?\nReference: '+rf.trim()+'\nOnly do this after you have seen this exact payment in the bank app.'))return;
      busy=true;const {error}=await sb.rpc('admin_activate_access',{p_driver:b.dataset.d,p_plan:b.dataset.p});busy=false;
      if(error)return say(plain(error));say('Switched on');lst()});
  }
}
async function pe(v){
  v.innerHTML=`<input id="s" placeholder="Search a name or phone number" value="${esc(q)}"><div class="row"><button class="btn ${flagged?'':'g'}" id="f1">With complaints</button><button class="btn ${flagged?'g':''}" id="f2">Everyone</button></div><div id="pl"></div>`;
  $('f1').onclick=()=>{flagged=true;render()};$('f2').onclick=()=>{flagged=false;render()};
  let t;$('s').oninput=e=>{q=e.target.value;clearTimeout(t);t=setTimeout(list,350)};list();
  async function list(){
    const {data,error}=await sb.rpc('admin_people',{p_q:q||null,p_flagged:flagged&&!q});if(error){$('pl').innerHTML='<div class="card">'+esc(plain(error))+'</div>';return}
    if(!data.length){$('pl').innerHTML='<div class="card" style="margin-top:12px">No one to show.</div>';return}
    $('pl').innerHTML=data.map(p=>`<div class="card" style="margin-top:12px"><b>${esc(p.name||'No name')}</b> <span class="tag">${esc(p.role||'')}</span>${p.suggestion?`<span class="tag ${p.suggestion==='Paused'?'':p.suggestion==='Pause now'?'red':'hot'}">${esc(p.suggestion)}</span>`:''}
      <div class="mut">${p.phone?'<a href="tel:'+esc(p.phone)+'">'+esc(p.phone)+'</a> · ':''}${esc(p.rides)} rides · ${esc(p.good)} good · ${esc(p.problems)} problems from ${esc(p.reporters)} people${p.unsafe_reporters?' · <b>'+esc(p.unsafe_reporters)+' said unsafe</b>':''}</div>
      <div class="row"><button class="btn g" data-id="${esc(p.user_id)}">Show ID</button>${p.paused?`<button class="btn g" data-r="${esc(p.user_id)}">Restore</button>`:`<button class="btn r" data-p="${esc(p.user_id)}" data-n="${esc(p.name||'this person')}">Pause</button>`}</div></div>`).join('');
    $('pl').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{
      const {data:d,error}=await sb.rpc('admin_person_id',{p_user:b.dataset.id});if(error)return say(plain(error));
      if(!d||!d[0]||!d[0].id_number)return say('No ID number given yet.');
      const x=d[0];if(confirm((x.id_kind==='passport'?'Passport: ':'ID: ')+x.id_number+'\nStatus: '+x.id_status+(x.id_status==='checked'?'':'\n\nPress OK to mark it as checked after you have seen the real document.')) && x.id_status!=='checked'){
        const r=await sb.rpc('admin_mark_id_checked',{p_user:b.dataset.id});say(r.error?plain(r.error):'Marked as checked')}});
    $('pl').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{
      const why=prompt('Pause '+b.dataset.n+'? They will not be able to ask for rides or use parcels, and a driver\'s car is set back to unapproved. Write a short reason:');
      if(why===null)return;if(!why.trim())return say('Please write a reason');
      const {error}=await sb.rpc('admin_pause',{p_user:b.dataset.p,p_reason:why.trim()});if(error)return say(plain(error));say('Paused');render()});
    $('pl').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Restore this account? A driver\'s car must be approved again on the Approvals tab.'))return;
      const {error}=await sb.rpc('admin_restore',{p_user:b.dataset.r});if(error)return say(plain(error));say('Restored');render()});
  }
}
boot();
</script></body></html>
