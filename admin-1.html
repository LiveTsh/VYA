<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#CC5500">
<title>VYA Admin</title>
<style>
:root{--o:#CC5500;--bg:#F8F9FA;--ink:#1A1A1A;--mut:#6B7280;--w:#fff;--line:#e5e7eb;--red:#b42318;--grn:#177245}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--o);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px;letter-spacing:.5px}header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
nav{display:flex;background:var(--w);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:4}
nav button{flex:1;border:0;background:none;padding:13px 4px;font-size:15px;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--o);border-color:var(--o);font-weight:600}
main{padding:14px 16px 80px;max-width:640px;margin:0 auto}
.card{background:var(--w);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--w);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:13px}.stat.hot b{color:var(--o)}
h2{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--o);color:#fff}
.btn.g{background:#eef0f2;color:var(--ink)}.btn.r{background:var(--red)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef0f2;color:var(--mut);margin-right:6px}
.tag.hot{background:#fde8d9;color:var(--o)}.tag.red{background:#fde4e1;color:var(--red)}
.mut{color:var(--mut);font-size:14px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;margin-top:8px;background:#fff}
#msg{position:fixed;left:12px;right:12px;bottom:14px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:9;text-align:center}
.center{max-width:380px;margin:60px auto;padding:0 16px}
a{color:var(--o)}
</style></head><body>
<div id="login" class="center" hidden>
  <h1 style="margin:0 0 4px">VYA Admin</h1><p class="mut">Sign in with your VYA account. Only people on the admin list get in.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="row"><button class="btn" style="width:100%" id="go">Sign in</button></div><p id="lerr" class="mut" style="color:var(--red)"></p>
</div>
<div id="app" hidden>
  <header><b>VYA Admin</b><button id="out">Sign out</button></header>
  <nav><button data-t="ov" class="on">Overview</button><button data-t="ap">Approvals <span id="nap"></span></button><button data-t="pe">People</button></nav>
  <main id="view"></main>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>
const sb=window.supabase.createClient("https://chncstdkoglykcrgxvfh.supabase.co","sb_publishable_4jo_x0_7NRdK3GEhfxvxwA_rTDAaiLA");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='ov',q='',flagged=true,busy=false;
function say(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',3200)}
function plain(e){const m=(e&&e.message)||'';if(/Not allowed/i.test(m))return 'This account is not on the admin list.';if(/paused/i.test(m))return m;if(/network|fetch/i.test(m))return 'No connection. Try again.';return m||'Something went wrong. Try again.'}
async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return showLogin();
  const {data:ok,error}=await sb.rpc('is_admin');
  if(error||ok!==true){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent='This account is not on the admin list.';return}
  $('login').hidden=true;$('app').hidden=false;render();
}
function showLogin(){$('app').hidden=true;$('login').hidden=false}
$('go').onclick=async()=>{$('lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){$('lerr').textContent='Wrong email or password.';return}boot()};
$('out').onclick=async()=>{await sb.auth.signOut({scope:'local'});showLogin()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
async function render(){
  const v=$('view');v.innerHTML='<p class="mut">Loading…</p>';
  try{ if(tab==='ov')await ov(v); else if(tab==='ap')await ap(v); else await pe(v); }catch(e){v.innerHTML='<div class="card">'+esc(plain(e))+'</div>'}
  refreshBadge();
}
async function refreshBadge(){try{const {data}=await sb.rpc('admin_pending');$('nap').textContent=data&&data.length?'('+data.length+')':''}catch(e){}}
async function ov(v){
  const {data:j,error}=await sb.rpc('admin_overview');if(error)throw error;
  const s=(n,l,hot)=>`<div class="stat${hot&&n>0?' hot':''}"><b>${esc(n)}</b><span>${esc(l)}</span></div>`;
  v.innerHTML=`<h2>Needs you</h2><div class="grid">${s(j.drivers_pending,'Drivers waiting',1)}${s(j.vehicles_pending,'Cars waiting',1)}${s(j.listings_pending,'Nearby listings waiting',1)}${s(j.paused,'Paused accounts')}</div>
  <h2>Rides</h2><div class="grid">${s(j.requests_waiting,'Waiting for a driver now')}${s(j.rides_today,'Completed today')}${s(j.rides_7d,'Completed, last 7 days')}${s(j.rides_total,'Completed, all time')}</div>
  <h2>People</h2><div class="grid">${s(j.people,'Accounts')}${s(j.drivers_approved,'Approved drivers')}</div>
  <p class="mut" style="margin-top:16px">Driver fee payments are not on this page yet. For now you check the bank app and tell me who to activate.</p>`;
}
async function ap(v){
  const {data,error}=await sb.rpc('admin_pending');if(error)throw error;
  if(!data.length){v.innerHTML='<div class="card">Nothing waiting. 🎉</div>';return}
  const lab={driver:'Driver',vehicle:'Car',listing:'Nearby'};
  v.innerHTML=data.map(r=>`<div class="card"><span class="tag hot">${lab[r.kind]||esc(r.kind)}</span><b>${esc(r.name||'No name')}</b>
   <div class="mut">${esc(r.info||'')}</div><div class="mut">${r.phone?'<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>':''}</div>
   <div class="row"><button class="btn" data-k="${esc(r.kind)}" data-i="${esc(r.id)}" data-a="1">Approve</button>${r.kind==='vehicle'?'':`<button class="btn g" data-k="${esc(r.kind)}" data-i="${esc(r.id)}" data-a="0">Reject</button>`}</div></div>`).join('');
  v.querySelectorAll('button[data-k]').forEach(b=>b.onclick=async()=>{
    if(busy)return;const ok=b.dataset.a==='1';if(!ok&&!confirm('Reject this? It cannot be undone from here.'))return;
    busy=true;const {error}=await sb.rpc('admin_decide',{p_kind:b.dataset.k,p_id:b.dataset.i,p_approve:ok});busy=false;
    if(error)return say(plain(error));say(ok?'Approved':'Rejected');render()});
}
async function pe(v){
  v.innerHTML=`<input id="s" placeholder="Search a name or phone number" value="${esc(q)}"><div class="row"><button class="btn ${flagged?'':'g'}" id="f1">With complaints</button><button class="btn ${flagged?'g':''}" id="f2">Everyone</button></div><div id="pl"></div>`;
  $('f1').onclick=()=>{flagged=true;render()};$('f2').onclick=()=>{flagged=false;render()};
  let t;$('s').oninput=e=>{q=e.target.value;clearTimeout(t);t=setTimeout(list,350)};list();
  async function list(){
    const {data,error}=await sb.rpc('admin_people',{p_q:q||null,p_flagged:flagged&&!q});if(error){$('pl').innerHTML='<div class="card">'+esc(plain(error))+'</div>';return}
    if(!data.length){$('pl').innerHTML='<div class="card" style="margin-top:12px">No one to show.</div>';return}
    $('pl').innerHTML=data.map(p=>`<div class="card" style="margin-top:12px"><b>${esc(p.name||'No name')}</b> <span class="tag">${esc(p.role||'')}</span>${p.suggestion?`<span class="tag ${p.suggestion==='Paused'?'':p.suggestion==='Pause now'?'red':'hot'}">${esc(p.suggestion)}</span>`:''}
      <div class="mut">${p.phone?'<a href="tel:'+esc(p.phone)+'">'+esc(p.phone)+'</a> · ':''}${esc(p.rides)} rides · ${esc(p.good)} good · ${esc(p.problems)} problems from ${esc(p.reporters)} people${p.unsafe_reporters?' · <b>'+esc(p.unsafe_reporters)+' said unsafe</b>':''}</div>
      <div class="row">${p.paused?`<button class="btn g" data-r="${esc(p.user_id)}">Restore</button>`:`<button class="btn r" data-p="${esc(p.user_id)}" data-n="${esc(p.name||'this person')}">Pause</button>`}</div></div>`).join('');
    $('pl').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{
      const why=prompt('Pause '+b.dataset.n+'? They will not be able to ask for rides or use parcels, and a driver\'s car is set back to unapproved. Write a short reason:');
      if(why===null)return;if(!why.trim())return say('Please write a reason');
      const {error}=await sb.rpc('admin_pause',{p_user:b.dataset.p,p_reason:why.trim()});if(error)return say(plain(error));say('Paused');render()});
    $('pl').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Restore this account? A driver\'s car must be approved again on the Approvals tab.'))return;
      const {error}=await sb.rpc('admin_restore',{p_user:b.dataset.r});if(error)return say(plain(error));say('Restored');render()});
  }
}
boot();
</script></body></html>
